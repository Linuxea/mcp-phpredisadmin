[project]
name = "pra-mcp"
version = "0.2.0"
description = "Operate Redis through a phpRedisAdmin web UI via MCP (stdio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "requests>=2.28",
]

[project.scripts]
pra-mcp = "pra_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pra_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
